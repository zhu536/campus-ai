[pytest]
testpaths = tests
python_files = test_*.py
# -p no:cacheprovider：关闭 pytest 的 .pytest_cache，避免在仓库根目录留下
# pytest-cache-files-* 临时目录（受限文件系统下还会因权限扫描失败报警告）。
# --basetemp：把 pytest 自己的临时目录固定在项目内，避免写入系统 %TEMP%
# （Windows 受限环境下 %TEMP% 可能不可写，会话级临时目录会创建失败）。
# 测试夹具用的临时目录由 tests/conftest.py 依次尝试 %TEMP% → 项目内
# .tmp_test_run（可用环境变量 CAMPUS_TEST_TMP 指定），同样不依赖仓库外路径。
addopts = -ra -p no:cacheprovider --basetemp=.pytest_tmp
# cacheprovider 已用 -p no:cacheprovider 关闭，cache_dir 当前不生效；
# 保留它只为记录缓存位置的约定（.gitignore 已忽略 .pytest_cache/）。
cache_dir = .pytest_cache
tmp_path_retention_policy = none
